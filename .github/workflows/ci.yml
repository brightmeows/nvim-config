name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stylua v2.5.2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -qo /tmp/stylua.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stylua"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install selene 0.31.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -qo /tmp/selene.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/selene"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: stylua --check .
        run: stylua --check .
      - name: selene lua init.lua plugin scripts
        run: selene lua init.lua plugin scripts

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - name: Place config at nvim stdpath('config')
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) cfg="${LOCALAPPDATA}/nvim" ;;
            *) cfg="${HOME}/.config/nvim" ;;
          esac
          mkdir -p "$cfg"
          cp -R "$GITHUB_WORKSPACE"/. "$cfg"/
          test -f "$cfg/init.lua" && echo "config in place: $cfg"
      - name: Cache plugins (unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/nvim
          key: nvim-plugins-${{ runner.os }}-${{ hashFiles('nvim-pack-lock.json') }}
      - name: Cache plugins (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/nvim-data
          key: nvim-plugins-${{ runner.os }}-${{ hashFiles('nvim-pack-lock.json') }}
      - name: Install plugins per lockfile
        run: >-
          nvim --headless
          -c 'lua local N=vim.tbl_count(vim.json.decode(table.concat(vim.fn.readfile("nvim-pack-lock.json"),"\n")).plugins);
          local opt=vim.fs.joinpath(vim.fn.stdpath("data"),"site","pack","core","opt");
          vim.fn.mkdir(opt,"p");
          local function cnt() local c=0 for _ in vim.fs.dir(opt) do c=c+1 end return c end;
          vim.wait(300000, function() return cnt()>=N end, 500);
          if cnt()<N then io.stderr:write(("INSTALL-INCOMPLETE %d/%d\n"):format(cnt(),N)); vim.cmd("cquit 1") end'
          -c 'qa!'
      - name: "Smoke judged: exit 0 and no Error (允许 warning)"
        run: |
          code=0
          nvim --headless -c 'lua vim.wait(2000, function() return false end, 50)' -c 'qa!' > smoke.log 2>&1 || code=$?
          cat smoke.log
          if [ "$code" -ne 0 ]; then
            echo "::error::nvim exited with code $code"
            exit 1
          fi
          if grep -q 'Error' smoke.log; then
            echo "::error::Error detected in startup output"
            exit 1
          fi
          echo "smoke OK"

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - name: Place config at nvim stdpath('config')
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) cfg="${LOCALAPPDATA}/nvim" ;;
            *) cfg="${HOME}/.config/nvim" ;;
          esac
          mkdir -p "$cfg"
          cp -R "$GITHUB_WORKSPACE"/. "$cfg"/
          test -f "$cfg/init.lua" && echo "config in place: $cfg"
      - name: Fresh install per lockfile (无缓存)
        run: >-
          nvim --headless
          -c 'lua local N=vim.tbl_count(vim.json.decode(table.concat(vim.fn.readfile("nvim-pack-lock.json"),"\n")).plugins);
          local opt=vim.fs.joinpath(vim.fn.stdpath("data"),"site","pack","core","opt");
          vim.fn.mkdir(opt,"p");
          local function cnt() local c=0 for _ in vim.fs.dir(opt) do c=c+1 end return c end;
          vim.wait(300000, function() return cnt()>=N end, 500);
          if cnt()<N then io.stderr:write(("INSTALL-INCOMPLETE %d/%d\n"):format(cnt(),N)); vim.cmd("cquit 1") end'
          -c 'qa!'
      - name: Verify installed git HEADs match lockfile
        run: nvim -l scripts/verify-lockfile.lua
