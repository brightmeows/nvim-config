name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stylua v2.5.2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -qo /tmp/stylua.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stylua"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install selene 0.31.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -qo /tmp/selene.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/selene"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pre-commit
        run: |
          if ! command -v pre-commit >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages pre-commit
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pre-commit --version
      - name: pre-commit run --all-files（与本地钩子同源）
        run: pre-commit run --all-files

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - name: 文档与命令串同源
        run: nvim -l scripts/check-docs-sync.lua

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - name: Place config at nvim stdpath('config')
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) cfg="${LOCALAPPDATA}/nvim" ;;
            *) cfg="${HOME}/.config/nvim" ;;
          esac
          mkdir -p "$cfg"
          cp -R "$GITHUB_WORKSPACE"/. "$cfg"/
          test -f "$cfg/init.lua" && echo "config in place: $cfg"
      - name: Install tree-sitter CLI (npm)
        run: npm install -g tree-sitter-cli
      - name: Cache plugins (unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/nvim
          key: nvim-plugins-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
      - name: Cache plugins (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/nvim-data
          key: nvim-plugins-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
      - name: Install plugins per lockfile and settle mason installs
        run: >-
          nvim --headless
          -c 'luafile scripts/settle-installs.lua'
          -c 'qa!'
      - name: "Strong smoke judged: exit 0 and no Error (允许 warning)"
        run: |
          code=0
          nvim --headless -c 'luafile scripts/strong-smoke.lua' -c 'qa!' > smoke.log 2>&1 || code=$?
          cat smoke.log
          if [ "$code" -ne 0 ]; then
            echo "::error::nvim exited with code $code"
            exit 1
          fi
          if grep -q 'Error' smoke.log; then
            echo "::error::Error detected in startup output"
            exit 1
          fi
          echo "strong smoke OK"
      - name: meow 单元测试
        run: nvim -l scripts/test-meow.lua

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - name: Place config at nvim stdpath('config')
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) cfg="${LOCALAPPDATA}/nvim" ;;
            *) cfg="${HOME}/.config/nvim" ;;
          esac
          mkdir -p "$cfg"
          cp -R "$GITHUB_WORKSPACE"/. "$cfg"/
          test -f "$cfg/init.lua" && echo "config in place: $cfg"
      - name: Fresh install per lockfile (无缓存，含 mason 收敛)
        run: >-
          nvim --headless
          -c 'luafile scripts/settle-installs.lua'
          -c 'qa!'
      - name: Verify installed git HEADs match lockfile
        run: nvim -l scripts/verify-lockfile.lua

  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: nightly
          neovim: true
      - name: Place config at nvim stdpath('config')
        run: |
          mkdir -p "$HOME/.config/nvim"
          cp -R "$GITHUB_WORKSPACE"/. "$HOME/.config/nvim"/
          test -f "$HOME/.config/nvim/init.lua" && echo "config in place"
      - name: Install plugins per lockfile and settle mason installs
        run: >-
          nvim --headless
          -c 'luafile scripts/settle-installs.lua'
          -c 'qa!'
      - name: Strong smoke（自判）
        run: nvim --headless -c 'luafile scripts/strong-smoke.lua' -c 'qa!'
      - name: meow 单元测试
        run: nvim -l scripts/test-meow.lua
